<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-label="Fire Drill flow: scope, gather evidence, rules decide, report card, confirmation gates">
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="30" y="40" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#24292f">Fire Drill: one drill, run on request</text>
  <text x="30" y="62" font-family="Segoe UI, sans-serif" font-size="12" fill="#57606a">simulation on synthetic data — every grade below comes from the written rules, never from a judgment call</text>

  <g font-family="Segoe UI, sans-serif" font-size="14">
    <rect x="60" y="90" width="200" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="160" y="118" text-anchor="middle" fill="#1e3a8a">Scope: which folders, whose</text>

    <rect x="330" y="90" width="220" height="46" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="440" y="112" text-anchor="middle" fill="#14532d">UGOS experts gather evidence</text>
    <text x="440" y="128" text-anchor="middle" fill="#14532d" font-size="11">find, stat, hashes, people, open tests</text>

    <rect x="600" y="90" width="200" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="700" y="112" text-anchor="middle" fill="#78350f">Written rules decide</text>
    <text x="700" y="128" text-anchor="middle" fill="#78350f" font-size="11">signals.md: thresholds, receipts</text>

    <line x1="260" y1="113" x2="330" y2="113" stroke="#64748b" marker-end="url(#arrow)"/>
    <line x1="550" y1="113" x2="600" y2="113" stroke="#64748b" marker-end="url(#arrow)"/>

    <rect x="150" y="180" width="560" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="180" y="208" fill="#24292f" font-weight="600">Report Card, per folder, in this order:</text>
    <text x="180" y="232" fill="#24292f">1 Vanished since the last drill</text>
    <text x="180" y="254" fill="#24292f">2 Only one copy (count and size of the irreplaceable set)</text>
    <text x="180" y="276" fill="#24292f">3 Silently stopped (newest file vs the folder's own rhythm)</text>
    <text x="180" y="298" fill="#24292f">4 Broken or partial uploads, ransomware-style warnings</text>
    <text x="180" y="320" fill="#24292f">5 Grade A to F, at most 3 fixes, receipt on every finding</text>

    <line x1="700" y1="136" x2="700" y2="160" stroke="#64748b"/>
    <line x1="700" y1="160" x2="430" y2="160" stroke="#64748b"/>
    <line x1="430" y1="160" x2="430" y2="180" stroke="#64748b" marker-end="url(#arrow)"/>

    <rect x="150" y="370" width="260" height="60" rx="8" fill="#fef9c3" stroke="#eab308"/>
    <text x="280" y="395" text-anchor="middle" fill="#713f12">You confirm a destination</text>
    <text x="280" y="413" text-anchor="middle" fill="#713f12" font-size="12">triage copy of the only-copy set (cpmv)</text>

    <rect x="450" y="370" width="260" height="60" rx="8" fill="#fef9c3" stroke="#eab308"/>
    <text x="580" y="395" text-anchor="middle" fill="#713f12">You confirm a location</text>
    <text x="580" y="413" text-anchor="middle" fill="#713f12" font-size="12">Report Card + manifest saved (save-text)</text>

    <line x1="360" y1="330" x2="280" y2="370" stroke="#64748b" marker-end="url(#arrow)"/>
    <line x1="500" y1="330" x2="580" y2="370" stroke="#64748b" marker-end="url(#arrow)"/>

    <rect x="150" y="470" width="560" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="430" y="498" text-anchor="middle" fill="#334155">Never deletes, moves or edits your files. Nothing leaves the device.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
