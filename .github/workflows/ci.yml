name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sim:
    name: Lint, typecheck, tests, bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run bench
      - name: "Score gate: at least 18/20, zero healthy flagged, two-drill matched"
        run: |
          node -e 'const r=require("./bench/results.json");const s=r.summary;if(s.score<r.target.minScore||s.healthyFlagged>r.target.maxHealthyFlagged||!s.twoDrillMatched){console.error("score gate failed:",JSON.stringify(s));process.exit(1)}console.log("score gate ok:",s.score+"/"+s.total,s.healthyFlagged+" healthy flagged")'
      - name: Rendered docs match results.json
        run: node bench/render.mjs --check

  drill-pack:
    name: Drill Pack expected results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node bench/validate-expected.mjs bench/drill-pack/expected.json

  skill-package:
    name: Kit checker on the skill package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the official starter kit (pinned URL, not committed)
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            -o /tmp/uliya-skill-kit.zip \
            "https://cdn.shopify.com/s/files/1/0630/9416/1602/files/uliya-skill-kit-0.7.3-en.zip?v=1790578898"
          mkdir -p /tmp/kit
          unzip -q /tmp/uliya-skill-kit.zip -d /tmp/kit
      - name: Run the checker and require a static pass
        run: |
          node /tmp/kit/uliya-skill-kit/scripts/check-skill.mjs skill/backup-fire-drill > /tmp/check-result.json || true
          node -e 'const r=require("/tmp/check-result.json");console.log("kit checker:",r.status,"errors:",r.summary.errors,"warnings:",r.summary.warnings);if(r.summary.errors!==0||r.summary.warnings!==0){console.error("static pass required: 0 errors and 0 warnings");process.exit(1)}'
      - name: Keep the checker output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-check-result
          path: /tmp/check-result.json

  attribution:
    name: Owner-only authorship, attribution guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the pull request commits
        run: |
          git fetch origin main --quiet
          range="origin/main..HEAD"
          if git log --no-merges --format=%B "$range" | grep -qiE '(co-authored-by:.*(claude|anthropic|glm|zhipu|z\.ai|openai|copilot|cursor))|(generated (with|by).*(claude|glm|ai\b|zcode))'; then
            echo "::error::attribution line found in commit messages"
            exit 1
          fi
          owner="${{ github.repository_owner }}"
          # Key the check on the account noreply email: display names differ
          # between clones, the noreply address identifies the account.
          pat="^[0-9]+\\+${owner}@users\\.noreply\\.github\\.com$"
          emails=$(git log --no-merges --format=%aE "$range" | sort -u)
          if printf '%s\n' "$emails" | grep -qvE "$pat"; then
            echo "::error::commit author is not the repo owner account (${owner})"
            echo "$emails"
            exit 1
          fi
          echo "attribution OK: every commit in this pull request is authored by the ${owner} account"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version)
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            -o /tmp/gitleaks.tgz \
            "https://github.com/zricethezav/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan the full history
        run: /tmp/gitleaks detect --source . --log-opts="--all" --redact --verbose

  demo:
    name: Demo app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix demo ci
      - run: npm --prefix demo run build

  proposal:
    name: Proposal word count (limit 500)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node proposal/count-words.mjs proposal/proposal.md

  package-zip:
    name: Submission ZIP and kit checker on it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-package-zip.mjs
      - name: Fetch the official starter kit (pinned URL, not committed)
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            -o /tmp/uliya-skill-kit.zip \
            "https://cdn.shopify.com/s/files/1/0630/9416/1602/files/uliya-skill-kit-0.7.3-en.zip?v=1790578898"
          mkdir -p /tmp/kit
          unzip -q /tmp/uliya-skill-kit.zip -d /tmp/kit
      - name: Run the checker on the unzipped package (0 errors, 0 warnings, 0 info)
        run: |
          unzip -q build/backup-fire-drill.zip -d /tmp/zipcheck
          node /tmp/kit/uliya-skill-kit/scripts/check-skill.mjs /tmp/zipcheck/backup-fire-drill > /tmp/zip-check-result.json || true
          node -e 'const r=require("/tmp/zip-check-result.json");console.log("zip kit checker:",r.status,"errors:",r.summary.errors,"warnings:",r.summary.warnings,"info:",r.summary.info);if(r.summary.errors!==0||r.summary.warnings!==0||r.summary.info!==0)process.exit(1)'
